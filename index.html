<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tooling Atlas is an open library of source-derived interface patterns, interaction modules, and agent workflow skills." />
    <meta name="theme-color" content="#f2eee5" />
    <title>Tooling Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./modules/diagram-kit.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="#overview" aria-label="Tooling Atlas overview">
        <span class="wordmark-mark">T/A</span>
        <span><strong>Tooling Atlas</strong><small>Reusable systems</small></span>
      </a>
      <p class="header-note">Design references + working packets</p>
      <button class="menu-button" id="menu-button" type="button" aria-expanded="false" aria-controls="directory">Directory</button>
      <a class="repo-link" href="https://github.com/WillyMLee/tooling-atlas" target="_blank" rel="noreferrer">Open repository ↗</a>
    </header>

    <div class="app-shell">
      <aside class="directory" id="directory">
        <div class="directory-intro">
          <span class="eyebrow">FIELD INDEX / 2026</span>
          <p>A practical shelf of things worth reusing.</p>
        </div>
        <label class="directory-search">
          <span>Search the atlas</span>
          <input id="directory-search" type="search" placeholder="Design, packet, skill…" autocomplete="off" />
        </label>
        <nav class="directory-nav" aria-label="Tooling Atlas directory">
          <div class="nav-group" data-search-group>
            <span class="nav-label">Start</span>
            <a href="#overview" data-route-link data-search-item="overview field notes">01 <strong>Overview</strong></a>
          </div>
          <div class="nav-group" data-search-group>
            <span class="nav-label">Design gallery</span>
            <div id="design-links"></div>
          </div>
          <div class="nav-group" data-search-group>
            <span class="nav-label">Reusable packets</span>
            <a href="#packets" data-route-link data-search-item="pattern packets live process product workflow problem radar ledger recipe planner">02 <strong>Pattern packets</strong></a>
            <a href="#interactions" data-route-link data-search-item="interaction packets motion hover reveal pulse">03 <strong>Interactions</strong></a>
          </div>
          <div class="nav-group" data-search-group>
            <span class="nav-label">Agent modules</span>
            <div id="skill-links"></div>
          </div>
          <div class="nav-group" data-search-group>
            <span class="nav-label">Notes</span>
            <a href="#about" data-route-link data-search-item="about tooling atlas repository">04 <strong>About</strong></a>
          </div>
        </nav>
        <div class="directory-foot"><span>MIT licensed</span><span id="atlas-count">— entries</span></div>
      </aside>

      <main id="view" tabindex="-1"></main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
