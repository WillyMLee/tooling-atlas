<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas eval · responsive overflow</title>
  <style>body{margin:0;padding:2rem;font:16px system-ui;color:#20211f;background:#f6f2e9}.panel{max-width:48rem;margin:auto;padding:1rem;border:1px solid #8d8c84;overflow:visible}.metric-row{display:grid;grid-template-columns:repeat(4,120px);gap:12px;min-width:516px}.metric{padding:1rem;background:#e1e8dc}.metric strong{display:block;font-size:1.5rem}@media(max-width:500px){body{padding:1rem}.panel{max-width:100%}}</style>
</head>
<body>
  <main class="panel">
    <h1>Quarterly operations</h1>
    <p>The cards should remain inside this panel at every supported width.</p>
    <div class="metric-row" data-testid="metric-row">
      <div class="metric"><strong>84%</strong>Coverage</div>
      <div class="metric"><strong>12</strong>Trials</div>
      <div class="metric"><strong>6</strong>Modules</div>
      <div class="metric"><strong>3</strong>Gates</div>
    </div>
  </main>
</body>
</html>
